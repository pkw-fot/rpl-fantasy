name: Обновление статистики РПЛ

on:
  schedule:
    # Запуск каждый понедельник в 03:00 МСК (после завершения тура)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Позволяет запускать парсер вручную кнопкой

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек
        run: |
          pip install -r requirements.txt

      - name: Запуск парсера
        run: |
          python update_stats.py

      - name: Автоматический коммит обновленного players.json
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add players.json
          git commit -m "Auto: обновление очков игроков за тур" || echo "Нет изменений"
          git push
