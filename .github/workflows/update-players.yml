name: Auto Update RPL Database

on:
  schedule:
    # Запуск каждый вторник в 12:00 МСК (09:00 UTC)
    - cron: '0 9 * * 2'
  workflow_dispatch: # Возможность запустить вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run updater script
        run: python update_players.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add players.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update RPL players database via Transfermarkt API" && git push)
