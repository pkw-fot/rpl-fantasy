<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>РПЛ Фэнтези Драфт</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pitch: '#0f291e',
            pitchLine: '#1e4d38',
            bgDark: '#090d16',
            cardDark: '#131b2e',
            accentGreen: '#10b981',
            accentAmber: '#f59e0b',
          }
        }
      }
    }
  </script>
  <style>
    .pitch-bg {
      background: radial-gradient(circle, #143828 0%, #0a1f16 100%);
      border: 2px solid #225e43;
      position: relative;
    }
    .pitch-center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border: 1px dashed #225e43;
      border-radius: 50%;
    }
    .pitch-half-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px dashed #225e43;
    }
  </style>
</head>
<body class="bg-bgDark text-slate-100 min-h-screen p-4 font-sans select-none flex flex-col justify-between">

  <div>
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
      <div>
        <h1 class="text-base font-black tracking-wide text-white uppercase flex items-center gap-2">
          <span>⚽ РПЛ: ДРАФТ ТУРА</span>
        </h1>
        <p class="text-xs text-slate-400">Собери 5 позиций на поле</p>
      </div>
      <div id="riskBadge" class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-xs font-bold text-accentGreen">
        Множитель: x1
      </div>
    </header>

    <!-- Игровой экран (Футбольное поле) -->
    <main id="mainScreen" class="space-y-4">
      
      <!-- Поле с позициями -->
      <div class="pitch-bg rounded-2xl p-4 shadow-2xl relative overflow-hidden flex flex-col justify-between h-[360px]">
        <div class="pitch-half-line"></div>
        <div class="pitch-center-circle"></div>

        <!-- Линия Атаки (2 слота) -->
        <div class="flex justify-around z-10">
          <button onclick="openPicker('FWD1')" id="slot-FWD1" class="w-32 p-2 bg-slate-900/90 border border-emerald-500/30 rounded-xl text-center backdrop-blur transition active:scale-95">
            <span class="text-[10px] text-emerald-400 font-bold uppercase block">Форвард #1</span>
            <div id="val-FWD1" class="text-xs font-bold text-white truncate mt-0.5">+ Выбрать</div>
            <div id="club-FWD1" class="text-[10px] text-slate-400 truncate">РПЛ</div>
          </button>
          <button onclick="openPicker('FWD2')" id="slot-FWD2" class="w-32 p-2 bg-slate-900/90 border border-emerald-500/30 rounded-xl text-center backdrop-blur transition active:scale-95">
            <span class="text-[10px] text-emerald-400 font-bold uppercase block">Форвард #2</span>
            <div id="val-FWD2" class="text-xs font-bold text-white truncate mt-0.5">+ Выбрать</div>
            <div id="club-FWD2" class="text-[10px] text-slate-400 truncate">РПЛ</div>
          </button>
        </div>

        <!-- Линия Полузащиты (1 слот - Плеймейкер/Вингер) -->
        <div class="flex justify-center z-10">
          <button onclick="openPicker('MID')" id="slot-MID" class="w-36 p-2 bg-slate-900/90 border border-amber-500/30 rounded-xl text-center backdrop-blur transition active:scale-95">
            <span class="text-[10px] text-amber-400 font-bold uppercase block">Полузащитник</span>
            <div id="val-MID" class="text-xs font-bold text-white truncate mt-0.5">+ Выбрать</div>
            <div id="club-MID" class="text-[10px] text-slate-400 truncate">РПЛ</div>
          </button>
        </div>

        <!-- Линия Защиты и Вратарь (2 слота) -->
        <div class="flex justify-around z-10">
          <button onclick="openPicker('DEF')" id="slot-DEF" class="w-32 p-2 bg-slate-900/90 border border-blue-500/30 rounded-xl text-center backdrop-blur transition active:scale-95">
            <span class="text-[10px] text-blue-400 font-bold uppercase block">Защитник</span>
            <div id="val-DEF" class="text-xs font-bold text-white truncate mt-0.5">+ Выбрать</div>
            <div id="club-DEF" class="text-[10px] text-slate-400 truncate">РПЛ</div>
          </button>
          <button onclick="openPicker('GK')" id="slot-GK" class="w-32 p-2 bg-slate-900/90 border border-purple-500/30 rounded-xl text-center backdrop-blur transition active:scale-95">
            <span class="text-[10px] text-purple-400 font-bold uppercase block">Вратарь</span>
            <div id="val-GK" class="text-xs font-bold text-white truncate mt-0.5">+ Выбрать</div>
            <div id="club-GK" class="text-[10px] text-slate-400 truncate">РПЛ</div>
          </button>
        </div>

      </div>

      <!-- Карточка All-in -->
      <div id="allinBox" class="p-3.5 bg-cardDark border border-amber-500/30 rounded-xl space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5">⚡ ПАНЧ ТУРА (ALL-IN)</span>
          <span class="text-[10px] font-bold bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">Кэф: 2.00</span>
        </div>
        <p class="text-xs text-slate-300 font-medium leading-relaxed">
          Забьет ли <b class="text-white">Константин Тюкавин</b> («Динамо») гол в эти выходные?
        </p>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="toggleRisk(true)" id="riskYesBtn" class="py-2 px-3 bg-slate-800 border border-slate-700 hover:border-amber-500 rounded-lg text-xs font-bold transition">
            🔥 Рискнуть (x2)
          </button>
          <button onclick="toggleRisk(false)" id="riskNoBtn" class="py-2 px-3 bg-slate-800 border border-slate-700 hover:border-slate-500 rounded-lg text-xs font-bold text-slate-400 transition">
            🛡️ Без риска (x1)
          </button>
        </div>
      </div>

    </main>

    <!-- Модалка выбора игрока из расширенной базы -->
    <div id="playerModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-cardDark border border-slate-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 max-h-[80vh] flex flex-col">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
          <div>
            <h3 id="modalTitle" class="text-sm font-bold text-white">Выбор игрока</h3>
            <p class="text-[11px] text-slate-400">Нажми на игрока для драфта в состав</p>
          </div>
          <button onclick="closePicker()" class="text-slate-400 hover:text-white text-lg px-2">✕</button>
        </div>
        <div id="playerList" class="overflow-y-auto py-3 space-y-2 flex-1"></div>
      </div>
    </div>
  </div>

  <!-- Футер / Кнопка действия -->
  <div class="pt-3">
    <button id="mainActionBtn" onclick="shareRoster()" class="w-full py-3.5 bg-accentGreen text-slate-950 font-black text-sm uppercase tracking-wide rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
      🚀 Сохранить и поделиться
    </button>
  </div>

  <script>
    // Инициализация Telegram Mini App SDK
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Расширенная база данных РПЛ по позициям
    const rplDatabase = {
      GK: [
        { name: "Матвей Сафонов", club: "Зенит / Топ", tier: "Звезда" },
        { name: "Игорь Акинфеев", club: "ЦСКА", tier: "Легенда" },
        { name: "Александр Максименко", club: "Спартак", tier: "Основа" },
        { name: "Виталий Гудиев", club: "Факел", tier: "Андердог" },
        { name: "Гиорги Шелия", club: "Ахмат", tier: "Андердог" }
      ],
      DEF: [
        { name: "Страхиня Эракович", club: "Зенит", tier: "Звезда" },
        { name: "Игорь Дивеев", club: "ЦСКА", tier: "Звезда" },
        { name: "Срджан Бабич", club: "Спартак", tier: "Основа" },
        { name: "Александр Сильянов", club: "Локомотив", tier: "Основа" },
        { name: "Максим Осипенко", club: "Ростов", tier: "Лидер" },
        { name: "Игорь Калинин", club: "Факел", tier: "Андердог" }
      ],
      MID: [
        { name: "Эдуард Сперцян", club: "Краснодар", tier: "Топ" },
        { name: "Вендел", club: "Зенит", tier: "Топ" },
        { name: "Алексей Батраков", club: "Локомотив", tier: "Открытие" },
        { name: "Лечи Садулаев", club: "Ахмат", tier: "Дриблер" },
        { name: "Эсекьель Барко", club: "Спартак", tier: "Топ" },
        { name: "Ильнур Альшин", club: "Факел", tier: "Андердог" },
        { name: "Данил Глебов", club: "Ростов", tier: "Основа" }
      ],
      FWD: [
        { name: "Константин Тюкавин", club: "Динамо", tier: "Бомбардир" },
        { name: "Джон Кордоба", club: "Краснодар", tier: "Топ" },
        { name: "Матео Кассьерра", club: "Зенит", tier: "Топ" },
        { name: "Манфред Угальде", club: "Спартак", tier: "Бомбардир" },
        { name: "Роналдо", club: "Ростов", tier: "Вингер" },
        { name: "Алексей Каштанов", club: "Факел", tier: "Андердог" },
        { name: "Дмитрий Воробьев", club: "Локомотив", tier: "Основа" }
      ]
    };

    const state = {
      roster: {
        FWD1: null,
        FWD2: null,
        MID: null,
        DEF: null,
        GK: null
      },
      multiplier: 1,
      currentSlot: null
    };

    function openPicker(slot) {
      state.currentSlot = slot;
      const category = slot.startsWith('FWD') ? 'FWD' : slot;
      const list = rplDatabase[category] || [];

      document.getElementById('modalTitle').innerText = `Выбор: ${slot.startsWith('FWD') ? 'Нападающий' : slot === 'MID' ? 'Полузащитник' : slot === 'DEF' ? 'Защитник' : 'Вратарь'}`;
      
      const container = document.getElementById('playerList');
      container.innerHTML = list.map((p, idx) => `
        <div onclick="selectPlayer('${p.name}', '${p.club}')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 rounded-xl flex items-center justify-between cursor-pointer transition active:scale-98">
          <div>
            <div class="font-bold text-xs text-white">${p.name}</div>
            <div class="text-[11px] text-slate-400">${p.club}</div>
          </div>
          <span class="text-[10px] font-bold px-2 py-0.5 bg-slate-900 rounded text-emerald-400 border border-slate-700">${p.tier}</span>
        </div>
      `).join('');

      document.getElementById('playerModal').classList.remove('hidden');
    }

    function closePicker() {
      document.getElementById('playerModal').classList.add('hidden');
    }

    function selectPlayer(name, club) {
      const slot = state.currentSlot;
      state.roster[slot] = { name, club };

      document.getElementById(`val-${slot}`).innerText = name;
      document.getElementById(`club-${slot}`).innerText = club;
      document.getElementById(`slot-${slot}`).classList.add('border-accentGreen', 'bg-emerald-950/40');

      closePicker();
    }

    function toggleRisk(isRisk) {
      state.multiplier = isRisk ? 2 : 1;
      
      const yesBtn = document.getElementById('riskYesBtn');
      const noBtn = document.getElementById('riskNoBtn');
      const badge = document.getElementById('riskBadge');

      if (isRisk) {
        yesBtn.className = 'py-2 px-3 bg-amber-500 border border-amber-400 text-slate-950 font-black rounded-lg text-xs transition';
        noBtn.className = 'py-2 px-3 bg-slate-800 border border-slate-700 text-slate-400 font-bold rounded-lg text-xs transition';
        badge.innerText = 'Множитель: x2 🔥';
        badge.className = 'bg-amber-500/20 border border-amber-500 px-2.5 py-1 rounded-full text-xs font-black text-amber-400';
      } else {
        noBtn.className = 'py-2 px-3 bg-slate-700 border border-slate-600 text-white font-black rounded-lg text-xs transition';
        yesBtn.className = 'py-2 px-3 bg-slate-800 border border-slate-700 text-slate-400 font-bold rounded-lg text-xs transition';
        badge.innerText = 'Множитель: x1';
        badge.className = 'bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-xs font-bold text-accentGreen';
      }
    }

    function shareRoster() {
      const missing = Object.entries(state.roster).filter(([k, v]) => !v);
      if (missing.length > 0) {
        alert('Заполните все позиции на поле перед сохранением!');
        return;
      }

      const text = `📋 МОЙ ДРАФТ РПЛ (Тур 19):\n` +
        `🧤 ВРТ: ${state.roster.GK.name} (${state.roster.GK.club})\n` +
        `🛡️ ЗАЩ: ${state.roster.DEF.name} (${state.roster.DEF.club})\n` +
        `🎯 ПЗ: ${state.roster.MID.name} (${state.roster.MID.club})\n` +
        `⚡ НАП: ${state.roster.FWD1.name} и ${state.roster.FWD2.name}\n\n` +
        `🔥 All-in: множитель x${state.multiplier}`;

      if (tg) {
        tg.openTelegramLink(`https://t.me/share/url?url=&text=${encodeURIComponent(text)}`);
      } else {
        navigator.clipboard.writeText(text);
        alert('Состав скопирован в буфер!');
      }
    }
  </script>
</body>
</html>
