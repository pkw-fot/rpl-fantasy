<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>РПЛ Фэнтези</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pitch: '#0d281a',
            bgDark: '#080c14',
            cardDark: '#111827',
            accentGreen: '#10b981',
            accentAmber: '#f59e0b',
          }
        }
      }
    }
  </script>
  <style>
    .pitch-bg {
      background: radial-gradient(circle at center, #153e2a 0%, #0a1f15 100%);
      border: 2px solid #236345;
      position: relative;
    }
    .pitch-line {
      border-color: rgba(34, 197, 94, 0.25);
    }
    .slot-card {
      transition: all 0.15s ease-in-out;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="bg-bgDark text-slate-100 min-h-screen p-3 font-sans select-none flex flex-col justify-between max-w-md mx-auto">

  <div class="space-y-3">
    <!-- Шапка -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-2.5">
      <div>
        <h1 class="text-sm font-black tracking-wide text-white uppercase flex items-center gap-1.5">
          <span>⚽ РПЛ: ДРАФТ СОСТАВА</span>
        </h1>
        <p class="text-[11px] text-slate-400">1 Вратарь • 4 Защитника • 3 Полузащитника • 3 Нападающих</p>
      </div>
      <div id="riskBadge" class="bg-slate-800 border border-slate-700 px-2.5 py-0.5 rounded-full text-xs font-bold text-accentGreen">
        x1
      </div>
    </header>

    <!-- Футбольное поле -->
    <main class="space-y-3">
      <div class="pitch-bg rounded-2xl p-2.5 shadow-2xl relative overflow-hidden flex flex-col justify-between h-[460px] border border-emerald-900/60">
        
        <!-- Разметка поля -->
        <div class="absolute inset-x-0 top-1/2 border-t pitch-line pointer-events-none"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 border pitch-line rounded-full pointer-events-none"></div>
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-28 h-12 border-b border-x pitch-line pointer-events-none"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-28 h-12 border-t border-x pitch-line pointer-events-none"></div>

        <!-- 1. Нападающие (3 игрока) -->
        <div class="grid grid-cols-3 gap-1.5 z-10">
          <button onclick="openPicker('FWD1', 'Нападающий')" id="slot-FWD1" class="slot-card p-1.5 border border-emerald-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-emerald-400 font-bold uppercase block">Нападающий</span>
            <div id="val-FWD1" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-FWD1" class="text-[9px] text-slate-400 truncate">Атака</div>
          </button>
          <button onclick="openPicker('FWD2', 'Нападающий')" id="slot-FWD2" class="slot-card p-1.5 border border-emerald-500/40 rounded-xl text-center active:scale-95 bg-slate-900/95">
            <span class="text-[9px] text-emerald-400 font-black uppercase block">Нападающий</span>
            <div id="val-FWD2" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-FWD2" class="text-[9px] text-slate-400 truncate">Центрфорвард</div>
          </button>
          <button onclick="openPicker('FWD3', 'Нападающий')" id="slot-FWD3" class="slot-card p-1.5 border border-emerald-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-emerald-400 font-bold uppercase block">Нападающий</span>
            <div id="val-FWD3" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-FWD3" class="text-[9px] text-slate-400 truncate">Атака</div>
          </button>
        </div>

        <!-- 2. Полузащитники (3 игрока) -->
        <div class="grid grid-cols-3 gap-1.5 z-10 my-auto">
          <button onclick="openPicker('MID1', 'Полузащитник')" id="slot-MID1" class="slot-card p-1.5 border border-amber-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-amber-400 font-bold uppercase block">Полузащитник</span>
            <div id="val-MID1" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-MID1" class="text-[9px] text-slate-400 truncate">Центр поля</div>
          </button>
          <button onclick="openPicker('MID2', 'Полузащитник')" id="slot-MID2" class="slot-card p-1.5 border border-amber-500/40 rounded-xl text-center active:scale-95 bg-slate-900/95">
            <span class="text-[9px] text-amber-400 font-black uppercase block">Полузащитник</span>
            <div id="val-MID2" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-MID2" class="text-[9px] text-slate-400 truncate">Опорная зона</div>
          </button>
          <button onclick="openPicker('MID3', 'Полузащитник')" id="slot-MID3" class="slot-card p-1.5 border border-amber-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-amber-400 font-bold uppercase block">Полузащитник</span>
            <div id="val-MID3" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-MID3" class="text-[9px] text-slate-400 truncate">Центр поля</div>
          </button>
        </div>

        <!-- 3. Защитники (4 игрока) -->
        <div class="grid grid-cols-4 gap-1 z-10">
          <button onclick="openPicker('DEF1', 'Защитник')" id="slot-DEF1" class="slot-card p-1 border border-blue-500/30 rounded-lg text-center active:scale-95">
            <span class="text-[8px] text-blue-400 font-bold uppercase block">Защитник</span>
            <div id="val-DEF1" class="text-[10px] font-bold text-white truncate">+ Выбор</div>
            <div id="club-DEF1" class="text-[8px] text-slate-400 truncate">Оборона</div>
          </button>
          <button onclick="openPicker('DEF2', 'Защитник')" id="slot-DEF2" class="slot-card p-1 border border-blue-500/30 rounded-lg text-center active:scale-95">
            <span class="text-[8px] text-blue-400 font-bold uppercase block">Защитник</span>
            <div id="val-DEF2" class="text-[10px] font-bold text-white truncate">+ Выбор</div>
            <div id="club-DEF2" class="text-[8px] text-slate-400 truncate">Оборона</div>
          </button>
          <button onclick="openPicker('DEF3', 'Защитник')" id="slot-DEF3" class="slot-card p-1 border border-blue-500/30 rounded-lg text-center active:scale-95">
            <span class="text-[8px] text-blue-400 font-bold uppercase block">Защитник</span>
            <div id="val-DEF3" class="text-[10px] font-bold text-white truncate">+ Выбор</div>
            <div id="club-DEF3" class="text-[8px] text-slate-400 truncate">Оборона</div>
          </button>
          <button onclick="openPicker('DEF4', 'Защитник')" id="slot-DEF4" class="slot-card p-1 border border-blue-500/30 rounded-lg text-center active:scale-95">
            <span class="text-[8px] text-blue-400 font-bold uppercase block">Защитник</span>
            <div id="val-DEF4" class="text-[10px] font-bold text-white truncate">+ Выбор</div>
            <div id="club-DEF4" class="text-[8px] text-slate-400 truncate">Оборона</div>
          </button>
        </div>

        <!-- 4. Вратарь (1 игрок) -->
        <div class="flex justify-center z-10 pt-1">
          <button onclick="openPicker('GK', 'Вратарь')" id="slot-GK" class="slot-card w-32 p-1.5 border border-purple-500/40 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-purple-400 font-bold uppercase block">Вратарь</span>
            <div id="val-GK" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-GK" class="text-[9px] text-slate-400 truncate">Голкипер</div>
          </button>
        </div>

      </div>

      <!-- Карточка All-in -->
      <div class="p-3 bg-cardDark border border-amber-500/30 rounded-xl space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-amber-400 flex items-center gap-1">⚡ ПАНЧ ТУРА (ALL-IN)</span>
          <span class="text-[10px] font-bold bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">Кэф: 2.00</span>
        </div>
        <p class="text-[11px] text-slate-300 font-medium leading-tight">
          Забьет ли <b class="text-white">Константин Тюкавин</b> гол в туре?
        </p>
        <div class="grid grid-cols-2 gap-2 pt-0.5">
          <button onclick="toggleRisk(true)" id="riskYesBtn" class="py-1.5 px-2 bg-slate-800 border border-slate-700 hover:border-amber-500 rounded-lg text-xs font-bold transition">
            🔥 Рискнуть (x2)
          </button>
          <button onclick="toggleRisk(false)" id="riskNoBtn" class="py-1.5 px-2 bg-slate-800 border border-slate-700 hover:border-slate-500 rounded-lg text-xs font-bold text-slate-400 transition">
            🛡️ Без риска (x1)
          </button>
        </div>
      </div>
    </main>

    <!-- Модалка выбора игрока -->
    <div id="playerModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-end justify-center p-0">
      <div class="bg-cardDark border-t border-slate-700 w-full max-w-md rounded-t-2xl p-4 max-h-[85vh] flex flex-col">
        <div class="flex justify-between items-center pb-2 border-b border-slate-800">
          <div>
            <h3 id="modalTitle" class="text-xs font-bold text-white uppercase tracking-wider">Выбор игрока</h3>
            <p class="text-[10px] text-slate-400">Официальная база РПЛ</p>
          </div>
          <button onclick="closePicker()" class="text-slate-400 hover:text-white text-base px-2">✕</button>
        </div>

        <!-- Поисковая строка -->
        <div class="pt-2">
          <input type="text" id="playerSearchInput" oninput="renderFilteredList()" placeholder="🔍 Поиск по фамилии или клубу..." class="w-full p-2 bg-slate-800/90 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-accentGreen" />
        </div>

        <!-- Список игроков -->
        <div id="playerList" class="overflow-y-auto py-2 space-y-1.5 flex-1"></div>
      </div>
    </div>
  </div>

  <!-- Футер -->
  <div class="pt-2">
    <button id="mainActionBtn" onclick="shareRoster()" class="w-full py-3 bg-accentGreen text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-1.5">
      🚀 Сохранить состав (0/11)
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Загрузка базы данных с 4 категориями
    let rplDatabase = { GK: [], DEF: [], MID: [], FWD: [] };

    async function initPlayers() {
      try {
        const res = await fetch('./players.json?v=' + Date.now());
        rplDatabase = await res.json();
        console.log('Официальная база игроков РПЛ загружена!');
      } catch (err) {
        console.error('Ошибка загрузки players.json:', err);
      }
    }
    initPlayers();

    const state = {
      roster: {
        FWD1: null, FWD2: null, FWD3: null,
        MID1: null, MID2: null, MID3: null,
        DEF1: null, DEF2: null, DEF3: null, DEF4: null,
        GK: null
      },
      multiplier: 1,
      currentSlot: null,
      currentPool: []
    };

    function getPoolBySlot(slot) {
      if (slot.startsWith('FWD')) return rplDatabase.FWD || [];
      if (slot.startsWith('MID')) return rplDatabase.MID || [];
      if (slot.startsWith('DEF')) return rplDatabase.DEF || [];
      if (slot === 'GK') return rplDatabase.GK || [];
      return [];
    }

    function openPicker(slot, categoryTitle) {
      state.currentSlot = slot;
      state.currentPool = getPoolBySlot(slot);

      document.getElementById('modalTitle').innerText = `Амплуа: ${categoryTitle}`;
      document.getElementById('playerSearchInput').value = '';
      
      renderFilteredList();
      document.getElementById('playerModal').classList.remove('hidden');
    }

    function renderFilteredList() {
      const q = (document.getElementById('playerSearchInput').value || '').toLowerCase().trim();
      const pool = state.currentPool || [];
      
      const filtered = pool.filter(p => {
        const name = (p.name || '').toLowerCase();
        const club = (p.club || '').toLowerCase();
        return name.includes(q) || club.includes(q);
      });

      const container = document.getElementById('playerList');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-xs text-slate-500">Игроки не найдены или база обновляется</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div onclick="selectPlayer('${(p.name || '').replace(/'/g, "\\'")}', '${(p.club || '').replace(/'/g, "\\'")}')" class="p-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 rounded-xl flex items-center justify-between cursor-pointer transition active:scale-98">
          <div>
            <div class="font-bold text-xs text-white">${p.name}</div>
            <div class="text-[10px] text-slate-400">${p.club || 'РПЛ'}</div>
          </div>
          <span class="text-[9px] font-bold px-1.5 py-0.5 bg-slate-900 rounded text-emerald-400 border border-slate-700">${p.tier || 'РПЛ'}</span>
        </div>
      `).join('');
    }

    function closePicker() {
      document.getElementById('playerModal').classList.add('hidden');
    }

    function selectPlayer(name, club) {
      const slot = state.currentSlot;
      state.roster[slot] = { name, club };

      const shortName = name.split(' ').pop();
      document.getElementById(`val-${slot}`).innerText = shortName;
      document.getElementById(`club-${slot}`).innerText = club;
      document.getElementById(`slot-${slot}`).classList.add('border-accentGreen', 'bg-emerald-950/60');

      closePicker();
      checkComplete();
    }

    function checkComplete() {
      const filled = Object.values(state.roster).filter(Boolean).length;
      document.getElementById('mainActionBtn').innerText = `🚀 Сохранить состав (${filled}/11)`;
    }

    function toggleRisk(isRisk) {
      state.multiplier = isRisk ? 2 : 1;
      
      const yesBtn = document.getElementById('riskYesBtn');
      const noBtn = document.getElementById('riskNoBtn');
      const badge = document.getElementById('riskBadge');

      if (isRisk) {
        yesBtn.className = 'py-1.5 px-2 bg-amber-500 border border-amber-400 text-slate-950 font-black rounded-lg text-xs transition';
        noBtn.className = 'py-1.5 px-2 bg-slate-800 border border-slate-700 text-slate-400 font-bold rounded-lg text-xs transition';
        badge.innerText = 'x2 🔥';
        badge.className = 'bg-amber-500/20 border border-amber-500 px-2.5 py-0.5 rounded-full text-xs font-black text-amber-400';
      } else {
        noBtn.className = 'py-1.5 px-2 bg-slate-700 border border-slate-600 text-white font-black rounded-lg text-xs transition';
        yesBtn.className = 'py-1.5 px-2 bg-slate-800 border border-slate-700 text-slate-400 font-bold rounded-lg text-xs transition';
        badge.innerText = 'x1';
        badge.className = 'bg-slate-800 border border-slate-700 px-2.5 py-0.5 rounded-full text-xs font-bold text-accentGreen';
      }
    }

    function shareRoster() {
      const filled = Object.values(state.roster).filter(Boolean).length;
      if (filled < 11) {
        alert(`Вы заполнили ${filled} из 11 позиций. Соберите всех игроков!`);
        return;
      }

      const text = `📋 МОЙ ДРАФТ РПЛ (4-3-3):\n` +
        `🧤 ВРТ: ${state.roster.GK.name} (${state.roster.GK.club})\n` +
        `🛡️ ЗАЩ: ${state.roster.DEF1.name}, ${state.roster.DEF2.name}, ${state.roster.DEF3.name}, ${state.roster.DEF4.name}\n` +
        `🎯 ПЗ: ${state.roster.MID1.name}, ${state.roster.MID2.name}, ${state.roster.MID3.name}\n` +
        `⚡ НАП: ${state.roster.FWD1.name}, ${state.roster.FWD2.name}, ${state.roster.FWD3.name}\n\n` +
        `🔥 All-in множитель: x${state.multiplier}`;

      if (tg) {
        tg.openTelegramLink(`https://t.me/share/url?url=&text=${encodeURIComponent(text)}`);
      } else {
        navigator.clipboard.writeText(text);
        alert('Состав скопирован!');
      }
    }
  </script>
</body>
</html>
