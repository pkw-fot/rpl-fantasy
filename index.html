<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CheDic — Аргентинский словарик</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgDark: '#090d16',
            cardDark: '#111827',
            argBlue: '#38bdf8',
            argGold: '#fbbf24'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090d16;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(17, 24, 39, 0.95), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(56, 189, 248, 0.18);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .flashcard-inner {
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flashcard-flipped {
      transform: rotateY(180deg);
    }
    .flashcard-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flashcard-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-bgDark text-slate-100 min-h-screen font-sans select-none max-w-md mx-auto flex flex-col justify-between pb-20">

  <!-- Шапка -->
  <header class="sticky top-0 z-30 bg-bgDark/90 backdrop-blur-md border-b border-slate-800/80 px-3.5 py-3 space-y-2.5">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🧉</span>
        <div>
          <h1 class="text-sm font-black tracking-wide text-white uppercase flex items-center gap-1.5">
            <span>CheDic</span>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-400 border border-sky-500/30">ES-AR</span>
          </h1>
          <p class="text-[10px] text-slate-400">Живой аргентинский словарь</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <span id="totalWordsBadge" class="text-[10px] font-bold text-slate-400 bg-slate-800/80 px-2 py-1 rounded-lg border border-slate-700/60">
          0 слов
        </span>
        <button onclick="loadWords()" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 flex items-center justify-center text-xs active:scale-95 transition" title="Обновить">
          🔄
        </button>
      </div>
    </div>

    <!-- Поиск и динамические категории -->
    <div id="searchBarWrapper" class="space-y-2">
      <div class="relative">
        <input
          type="text"
          id="searchInput"
          oninput="renderWordsList()"
          placeholder="Поиск по слову, артиклю или переводу..."
          class="w-full bg-slate-900/90 border border-slate-700/80 focus:border-sky-400 rounded-xl pl-8 pr-8 py-2 text-xs text-white placeholder-slate-500 focus:outline-none transition"
        />
        <span class="absolute left-2.5 top-2 text-xs text-slate-500">🔍</span>
        <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute right-2.5 top-2 text-xs text-slate-400 hover:text-white">✕</button>
      </div>

      <!-- Автоматические теги категорий -->
      <div id="categoryTabs" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5 text-[11px] font-bold"></div>
    </div>
  </header>

  <!-- Контент: Экран 1 — Лента словаря -->
  <main id="dictView" class="flex-1 px-3.5 py-3 space-y-2.5">
    <div id="loadingIndicator" class="text-center py-10 text-xs text-slate-400 animate-pulse">
      Загружаем аргентинский словарь...
    </div>
    <div id="wordsContainer" class="space-y-2.5"></div>
  </main>

  <!-- Контент: Экран 2 — Карточки для запоминания -->
  <main id="cardsView" class="hidden flex-1 px-3.5 py-4 flex flex-col items-center justify-center space-y-4">
    <div class="text-center space-y-0.5">
      <div class="text-[10px] font-black text-sky-400 uppercase tracking-widest">ТРЕНАЖЁР ПАМЯТИ</div>
      <div id="cardCounter" class="text-xs text-slate-400">Карточка 1 из 1</div>
    </div>

    <div onclick="flipFlashcard()" class="w-full h-64 cursor-pointer">
      <div id="flashcardInner" class="flashcard-inner relative w-full h-full">
        <!-- Лицевая сторона -->
        <div class="flashcard-face absolute inset-0 glass-card rounded-3xl p-5 flex flex-col justify-between items-center text-center">
          <div class="w-full flex justify-between items-center">
            <span id="fcCategory" class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-sky-500/20 text-sky-400">Общение</span>
            <button onclick="event.stopPropagation(); speakCurrentFlashcard()" class="w-9 h-9 rounded-full bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 flex items-center justify-center text-base border border-sky-500/30 active:scale-90 transition">
              🔊
            </button>
          </div>
          <div class="space-y-1.5 my-auto">
            <div id="fcEs" class="text-2xl font-black text-white leading-tight">El bondi</div>
            <div id="fcPhonetic" class="text-xs font-semibold text-amber-400">[Эль бо́нди]</div>
          </div>
          <div class="text-[10px] text-slate-500">Нажми на карточку, чтобы увидеть перевод</div>
        </div>

        <!-- Обратная сторона -->
        <div class="flashcard-face flashcard-back absolute inset-0 glass-card rounded-3xl p-5 flex flex-col justify-between items-center text-center border-amber-400/40">
          <div class="text-[10px] font-bold text-amber-400 uppercase">Перевод и контекст</div>
          <div class="space-y-3 my-auto w-full">
            <div id="fcRu" class="text-xl font-black text-white">Автобус</div>
            <div class="p-2.5 rounded-xl bg-slate-900/90 border border-slate-800 text-left space-y-1">
              <div id="fcContextEs" class="text-xs font-bold text-sky-300">Me tomo el bondi.</div>
              <div id="fcContextRu" class="text-[11px] text-slate-400">Я сажусь на автобус.</div>
            </div>
          </div>
          <div class="text-[10px] text-slate-500">Нажми, чтобы вернуть</div>
        </div>
      </div>
    </div>

    <div class="flex gap-3 w-full">
      <button onclick="nextFlashcard()" class="flex-1 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700 active:scale-95 transition">
        🔄 Ещё учу
      </button>
      <button onclick="nextFlashcard()" class="flex-1 py-3 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 text-slate-950 font-black text-xs active:scale-95 transition shadow-lg shadow
