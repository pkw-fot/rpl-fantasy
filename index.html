<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>РПЛ Фэнтези: Трансферный Драфт</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pitch: '#0d281a',
            bgDark: '#080c14',
            cardDark: '#111827',
            accentGreen: '#10b981',
            accentGold: '#f59e0b',
          }
        }
      }
    }
  </script>
  <style>
    .pitch-bg {
      background: radial-gradient(circle at center, #153e2a 0%, #0a1f15 100%);
      border: 2px solid #236345;
      position: relative;
    }
    .pitch-line {
      border-color: rgba(34, 197, 94, 0.25);
    }
    .slot-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(4px);
    }
    .slot-highlight {
      animation: slotPulse 1.2s infinite alternate;
      border-color: #10b981 !important;
      background: rgba(16, 185, 129, 0.2) !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
    }
    @keyframes slotPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }
    /* 3D карточки пака */
    .card-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    .card-glow {
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);
    }
  </style>
</head>
<body class="bg-bgDark text-slate-100 min-h-screen p-3 font-sans select-none flex flex-col justify-between max-w-md mx-auto">

  <div class="space-y-3">
    <!-- Шапка -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-2">
      <div>
        <h1 class="text-xs font-black tracking-wide text-white uppercase flex items-center gap-1.5">
          <span>⚽ РПЛ: ДРАФТ ПАКИ</span>
        </h1>
        <p class="text-[10px] text-slate-400">Тяни пак и собирай основу</p>
      </div>
      <div id="riskBadge" class="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded-full text-[11px] font-bold text-accentGreen">
        x1
      </div>
    </header>

    <!-- Блок «Трансферный Пак» над полем -->
    <section class="p-3 bg-gradient-to-r from-slate-900 via-amber-950/40 to-slate-900 border border-amber-500/40 rounded-2xl shadow-xl flex items-center justify-between relative overflow-hidden">
      <div class="space-y-0.5 z-10">
        <div class="flex items-center gap-1.5">
          <span class="text-base">📦</span>
          <span class="text-xs font-black text-amber-400 tracking-wider uppercase">Трансферный Пак</span>
        </div>
        <p id="packStatusLabel" class="text-[10px] text-slate-300">Нажми, чтобы вскрыть 3 игроков</p>
      </div>
      <button onclick="triggerDraftPack()" id="openPackBtn" class="z-10 px-3.5 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl shadow-lg active:scale-95 transition flex items-center gap-1">
        ✨ Вскрыть
      </button>
      <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-amber-500/10 rounded-full blur-xl pointer-events-none"></div>
    </section>

    <!-- Подсказка при выбранной карточке -->
    <div id="placementBanner" class="hidden p-2 bg-emerald-950/80 border border-emerald-500/50 rounded-xl text-center text-xs font-bold text-emerald-300 animate-pulse">
      👉 Кликни по свободному слоту на поле для установки
    </div>

    <!-- Футбольное поле -->
    <main class="space-y-3">
      <div class="pitch-bg rounded-2xl p-2.5 shadow-2xl relative overflow-hidden flex flex-col justify-between h-[430px] border border-emerald-900/60">
        
        <!-- Разметка поля -->
        <div class="absolute inset-x-0 top-1/2 border-t pitch-line pointer-events-none"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 border pitch-line rounded-full pointer-events-none"></div>
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-28 h-12 border-b border-x pitch-line pointer-events-none"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-28 h-12 border-t border-x pitch-line pointer-events-none"></div>

        <!-- 1. Нападающие (3 слота) -->
        <div class="grid grid-cols-3 gap-1.5 z-10">
          <button onclick="handleSlotClick('FWD1', 'FWD')" id="slot-FWD1" class="slot-card p-1.5 border border-emerald-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-emerald-400 font-bold uppercase block">Нападающий</span>
            <div id="val-FWD1" class="text-[11px] font-bold text-white truncate">+ Слот 1</div>
            <div id="club-FWD1" class="text-[9px] text-slate-400 truncate">Свободно</div>
          </button>
          <button onclick="handleSlotClick('FWD2', 'FWD')" id="slot-FWD2" class="slot-card p-1.5 border border-emerald-500/40 rounded-xl text-center active:scale-95 bg-slate-900/95">
            <span class="text-[9px] text-emerald-400 font-black uppercase block">Нападающий</span>
            <div id="val-FWD2" class="text-[11px] font-bold text-white truncate">+ Слот 2</div>
            <div id="club-FWD2" class="text-[9px] text-slate-400 truncate">Свободно</div>
          </button>
          <button onclick="handleSlotClick('FWD3', 'FWD')" id="slot-FWD3" class="slot-card p-1.5 border border-emerald-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-emerald-400 font-bold uppercase block">Нападающий</span>
            <div id="val-FWD3" class="text-[11px] font-bold text-white truncate">+ Слот 3</div>
            <div id="club-FWD3" class="text-[9px] text-slate-400 truncate">Свободно</div>
          </button>
        </div>

        <!-- 2. Полузащитники (3 слота) -->
        <div class="grid grid-cols-3 gap-1.5 z-10 my-auto">
          <button onclick="handleSlotClick('MID1', 'MID')" id="slot-MID1" class="slot-card p-1.5 border border-amber-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-amber-400 font-bold uppercase block">Полузащитник</span>
            <div id="val-MID1" class="text-[11px] font-bold text-white truncate">+ Слот 1</div>
            <div id="club-MID1" class="text-[9px] text-slate-400 truncate">Свободно</div>
          </button>
          <button onclick="handleSlotClick('MID2', 'MID')" id="slot-MID2" class="slot-card p-1.5 border border-amber-500/40 rounded-xl text-center active:scale-95 bg-slate-900/95">
            <span class="text-[9px] text-amber-400 font-black uppercase block">Полузащитник</span>
            <div id="val-MID2" class="text-[11px] font-bold text-white truncate">+ Слот 2</div>
            <div id="club-MID2" class="text-[9px] text-slate-400 truncate">Свободно</div>
          </button>
          <button onclick="handleSlotClick('MID3', 'MID')" id="slot-MID3" class="slot-card p-1.5 border border-amber-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-amber-400 font-bold uppercase block">Полузащитник</span>
            <div id="val-MID3" class="text-[11px] font-bold text-white truncate">+ Слот 3</div>
            <div id="club-MID3" class="text-[9px] text-slate-400 truncate">Свободно</div>
          </button>
        </div>

        <!-- 3. Защитники (4 слота) -->
        <div class="grid grid-cols-4 gap-1 z-10">
          <button onclick="handleSlotClick('DEF1', 'DEF')" id="slot-DEF1" class="slot-card p-1 border border-blue-500/30 rounded-lg text-center active:scale-95">
            <span class="text-[8px] text-blue-400 font-bold uppercase block">Защитник</span>
            <div id="val-DEF1" class="text-[10px] font-bold text-white truncate">+ Слот 1</div>
            <div id="club-DEF1" class="text-[8px] text-slate-400 truncate">Свободно</div>
          </button>
          <button onclick="handleSlotClick('DEF2', 'DEF')" id="slot-DEF2" class="slot-card p-1 border border-blue-500/30 rounded-lg text-center active:scale-95">
            <span class="text-[8px] text-blue-400 font-bold uppercase block">Защитник</span>
            <div id="val-DEF2" class="text-[10px] font-bold text-white truncate">+ Слот 2</div>
            <div id="club-DEF2" class="text-[8px] text-slate-400 truncate">Свободно</div>
          </button>
          <button onclick="handleSlotClick('DEF3', 'DEF')" id="slot-DEF3" class="slot-card p-1 border border-blue-500/30 rounded-lg text-center active:scale-95">
            <span class="text-[8px] text-blue-400 font-bold uppercase block">Защитник</span>
            <div id="val-DEF3" class="text-[10px] font-bold text-white truncate">+ Слот 3</div>
            <div id="club-DEF3" class="text-[8px] text-slate-400 truncate">Свободно</div>
          </button>
          <button onclick="handleSlotClick('DEF4', 'DEF')" id="slot-DEF4" class="slot-card p-1 border border-blue-500/30 rounded-lg text-center active:scale-95">
            <span class="text-[8px] text-blue-400 font-bold uppercase block">Защитник</span>
            <div id="val-DEF4" class="text-[10px] font-bold text-white truncate">+ Слот 4</div>
            <div id="club-DEF4" class="text-[8px] text-slate-400 truncate">Свободно</div>
          </button>
        </div>

        <!-- 4. Вратарь (1 слот) -->
        <div class="flex justify-center z-10 pt-1">
          <button onclick="handleSlotClick('GK', 'GK')" id="slot-GK" class="slot-card w-28 p-1 border border-purple-500/40 rounded-xl text-center active:scale-95">
            <span class="text-[8px] text-purple-400 font-bold uppercase block">Вратарь</span>
            <div id="val-GK" class="text-[10px] font-bold text-white truncate">+ Вратарь</div>
            <div id="club-GK" class="text-[8px] text-slate-400 truncate">Свободно</div>
          </button>
        </div>

      </div>
    </main>

    <!-- Модалка вскрытия пака -->
    <div id="packModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4">
      <div class="text-center space-y-1 mb-6">
        <div id="modalPackRole" class="text-xs font-black text-amber-400 uppercase tracking-widest animate-pulse">РАСПАКОВКА...</div>
        <h2 class="text-lg font-black text-white uppercase">Выбери 1 игрока</h2>
        <p class="text-[11px] text-slate-400">Один футболист отправится в основу</p>
      </div>

      <!-- Контейнер с 3 карточками -->
      <div id="packCardsContainer" class="flex justify-center gap-2.5 w-full max-w-sm"></div>
    </div>
  </div>

  <!-- Футер -->
  <div class="pt-2">
    <button id="mainActionBtn" onclick="shareRoster()" class="w-full py-3 bg-accentGreen text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-1.5">
      🚀 Сохранить состав (0/11)
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    let rplDatabase = { GK: [], DEF: [], MID: [], FWD: [] };

    // Загрузка актуального players.json
    async function initPlayers() {
      try {
        const res = await fetch('./players.json?v=' + Date.now());
        rplDatabase = await res.json();
        console.log('База РПЛ готова!');
      } catch (err) {
        console.error('Ошибка загрузки players.json:', err);
      }
    }
    initPlayers();

    const state = {
      roster: {
        FWD1: null, FWD2: null, FWD3: null,
        MID1: null, MID2: null, MID3: null,
        DEF1: null, DEF2: null, DEF3: null, DEF4: null,
        GK: null
      },
      selectedPlayerFromPack: null,
      currentPackRole: null
    };

    const ROLES = [
      { key: 'GK', title: 'Вратари' },
      { key: 'DEF', title: 'Защитники' },
      { key: 'MID', title: 'Полузащитники' },
      { key: 'FWD', title: 'Нападающие' }
    ];

    // Вскрытие пака
    function triggerDraftPack() {
      // 1. Выбираем случайную позицию из доступных
      const randomRole = ROLES[Math.floor(Math.random() * ROLES.length)];
      state.currentPackRole = randomRole.key;

      const pool = rplDatabase[randomRole.key] || [];
      if (pool.length < 3) {
        alert('База игроков загружается, подождите 2 секунды...');
        return;
      }

      // 2. Выбираем 3 случайных уникальных игрока
      const shuffled = [...pool].sort(() => 0.5 - Math.random());
      const selectedThree = shuffled.slice(0, 3);

      // 3. Открываем окно с анимацией
      showPackModal(selectedThree, randomRole.title);
    }

    function showPackModal(cards, roleTitle) {
      const modal = document.getElementById('packModal');
      const container = document.getElementById('packCardsContainer');
      const roleBadge = document.getElementById('modalPackRole');

      roleBadge.innerText = `ПАК ПОЗИЦИИ: ${roleTitle}`;
      container.innerHTML = '';
      modal.classList.remove('hidden');

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }

      cards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card-3d opacity-0 scale-75 flex-1 p-3 bg-gradient-to-b from-slate-800 to-slate-900 border-2 border-amber-500/40 rounded-2xl text-center shadow-2xl flex flex-col justify-between h-44 cursor-pointer active:scale-95 transition-all';
        
        cardEl.innerHTML = `
          <div>
            <span class="text-[9px] font-black text-amber-400 uppercase tracking-wide block">${card.club}</span>
            <div class="my-2 text-3xl">🏃‍♂️</div>
          </div>
          <div>
            <div class="font-black text-[11px] text-white leading-tight mb-1">${card.name}</div>
            <span class="text-[8px] font-bold px-1.5 py-0.5 bg-amber-500/20 text-amber-300 rounded border border-amber-500/30">ВЫБРАТЬ</span>
          </div>
        `;

        cardEl.onclick = () => selectCardFromPack(card);
        container.appendChild(cardEl);

        // Поочередное появление с приятным эффектом
        setTimeout(() => {
          cardEl.classList.remove('opacity-0', 'scale-75');
          cardEl.classList.add('opacity-100', 'scale-100', 'card-glow');
        }, index * 180);
      });
    }

    // Выбор игрока из 3
    function selectCardFromPack(card) {
      state.selectedPlayerFromPack = card;
      document.getElementById('packModal').classList.add('hidden');

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('heavy');
      }

      // Подсвечиваем доступные слоты на поле
      highlightTargetSlots(state.currentPackRole);

      // Показываем плашку подсказки
      const banner = document.getElementById('placementBanner');
      banner.innerText = `✅ Выбран: ${card.name} (${card.club}). Кликни по свободному слоту на поле!`;
      banner.classList.remove('hidden');
    }

    // Подсветка подходящих слотов на поле
    function highlightTargetSlots(role) {
      clearHighlights();
      Object.keys(state.roster).forEach(slot => {
        if (slot.startsWith(role) && !state.roster[slot]) {
          document.getElementById(`slot-${slot}`).classList.add('slot-highlight');
        }
      });
    }

    function clearHighlights() {
      document.querySelectorAll('.slot-card').forEach(el => {
        el.classList.remove('slot-highlight');
      });
    }

    // Клик по слоту на поле
    function handleSlotClick(slot, slotRole) {
      // Если игрок только что выбрал футболиста из пака
      if (state.selectedPlayerFromPack) {
        if (state.currentPackRole !== slotRole) {
          alert(`Этот футболист — ${state.currentPackRole}, его нельзя поставить в позицию ${slotRole}!`);
          return;
        }

        // Ставим игрока в слот
        const p = state.selectedPlayerFromPack;
        state.roster[slot] = p;

        const shortName = p.name.split(' ').pop();
        document.getElementById(`val-${slot}`).innerText = shortName;
        document.getElementById(`club-${slot}`).innerText = p.club;
        document.getElementById(`slot-${slot}`).classList.add('border-accentGreen', 'bg-emerald-950/70');

        // Сброс выбора
        state.selectedPlayerFromPack = null;
        clearHighlights();
        document.getElementById('placementBanner').classList.add('hidden');

        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }

        checkComplete();
      } else {
        // Если пак еще не открыт
        triggerDraftPack();
      }
    }

    function checkComplete() {
      const filled = Object.values(state.roster).filter(Boolean).length;
      document.getElementById('mainActionBtn').innerText = `🚀 Сохранить состав (${filled}/11)`;
    }

    function shareRoster() {
      const filled = Object.values(state.roster).filter(Boolean).length;
      if (filled < 11) {
        alert(`Состав заполнен на ${filled} из 11. Открывайте паки дальше!`);
        return;
      }

      const text = `📋 МОЙ СТАРТОВЫЙ ДРАФТ РПЛ:\n` +
        `🧤 ВРТ: ${state.roster.GK.name} (${state.roster.GK.club})\n` +
        `🛡️ ЗАЩ: ${state.roster.DEF1.name}, ${state.roster.DEF2.name}, ${state.roster.DEF3.name}, ${state.roster.DEF4.name}\n` +
        `🎯 ПЗ: ${state.roster.MID1.name}, ${state.roster.MID2.name}, ${state.roster.MID3.name}\n` +
        `⚡ НАП: ${state.roster.FWD1.name}, ${state.roster.FWD2.name}, ${state.roster.FWD3.name}`;

      if (tg) {
        tg.openTelegramLink(`https://t.me/share/url?url=&text=${encodeURIComponent(text)}`);
      } else {
        navigator.clipboard.writeText(text);
        alert('Состав скопирован!');
      }
    }
  </script>
</body>
</html>
