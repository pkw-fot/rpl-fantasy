  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pitch: '#0d281a',
            bgDark: '#080c14',
            cardDark: '#111827',
            accentGreen: '#10b981',
            accentAmber: '#f59e0b',
          }
        }
      }
    }
  </script>
  <style>
    .pitch-bg {
      background: radial-gradient(circle at center, #153e2a 0%, #0a1f15 100%);
      border: 2px solid #236345;
      position: relative;
    }
    .pitch-line {
      border-color: rgba(34, 197, 94, 0.25);
    }
    .slot-card {
      transition: all 0.15s ease-in-out;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(4px);
    }

        <p class="text-[11px] text-slate-400">16 клубов лиги • Поиск и фильтры</p>

      <div id="riskBadge" class="bg-slate-800 border border-slate-700 px-2.5 py-0.5 rounded-full text-xs font-bold text-accentGreen">

    </header>

        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-28 h-12 border-t border-x pitch-line pointer-events-none"></div>

        <!-- 1. Линия Атаки -->
        <div class="grid grid-cols-3 gap-1.5 z-10">
          <button onclick="openPicker('LW')" id="slot-LW" class="slot-card p-1.5 border border-emerald-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-emerald-400 font-bold uppercase block">ЛВ</span>
            <div id="val-LW" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-LW" class="text-[9px] text-slate-400 truncate">Вингер</div>
          </button>
          <button onclick="openPicker('ST')" id="slot-ST" class="slot-card p-1.5 border border-emerald-500/40 rounded-xl text-center active:scale-95 bg-slate-900/95">
            <span class="text-[9px] text-emerald-400 font-black uppercase block">ЦН</span>
            <div id="val-ST" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-ST" class="text-[9px] text-slate-400 truncate">Форвард</div>
          </button>
          <button onclick="openPicker('RW')" id="slot-RW" class="slot-card p-1.5 border border-emerald-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-emerald-400 font-bold uppercase block">ПВ</span>
            <div id="val-RW" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-RW" class="text-[9px] text-slate-400 truncate">Вингер</div>
          </button>
        </div>

        <!-- 2. Линия Полузащиты -->
        <div class="grid grid-cols-3 gap-1.5 z-10 my-auto">
          <button onclick="openPicker('LM')" id="slot-LM" class="slot-card p-1.5 border border-amber-500/30 rounded-xl text-center active:scale-95">
            <span class="text-[9px] text-amber-400 font-bold uppercase block">ЛПЗ</span>
            <div id="val-LM" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>
            <div id="club-LM" class="text-[9px] text-slate-400 truncate">Хавбек</div>
          </button>
          <button onclick="openPicker('CM')" id="slot-CM" class="slot-card p-1.5 border border-amber-500/40 rounded-xl text-center active:scale-95 bg-slate-900/95">
            <span class="text-[9px] text-amber-400 font-black uppercase block">ЦОП</span>
            <div id="val-CM" class="text-[11px] font-bold text-white truncate">+ Выбрать</div>

            <div id="club-GK" class="text-[8px] text-slate-400 truncate">Голкипер</div>

        </div>

      <!-- Карточка All-in -->

        <div class="flex items-center justify-between">

    const state = {
      roster: {
        LW: null, ST: null, RW: null,
        LM: null, CM: null, RM: null,
        LB: null, CB1: null, CB2: null, RB: null,
        GK: null
      },
      multiplier: 1,
      currentSlot: null,
      currentPool: []
    };

    function getPoolBySlot(slot) {
      if (['LW', 'ST', 'RW'].includes(slot)) return rplDatabase.FWD;
      if (['LM', 'CM', 'RM'].includes(slot)) return rplDatabase.MID;
      if (['CB1', 'CB2'].includes(slot)) return rplDatabase.CB;
      if (slot === 'LB') return rplDatabase.LB;
      if (slot === 'RB') return rplDatabase.RB;
      if (slot === 'GK') return rplDatabase.GK;
      return [];
    }

    function openPicker(slot) {
      state.currentSlot = slot;
      state.currentPool = getPoolBySlot(slot);

      document.getElementById('modalTitle').innerText = `Позиция: ${slot}`;
      document.getElementById('playerSearchInput').value = '';
      
      renderFilteredList();
      document.getElementById('playerModal').classList.remove('hidden');
    }

    function renderFilteredList() {
      const q = document.getElementById('playerSearchInput').value.toLowerCase().trim();
      const filtered = state.currentPool.filter(p => 
        p.name.toLowerCase().includes(q) || p.club.toLowerCase().includes(q)
      );

      const container = document.getElementById('playerList');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-xs text-slate-500">Игроки не найдены</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div onclick="selectPlayer('${p.name.replace(/'/g, "\\'")}', '${p.club.replace(/'/g, "\\'")}')" class="p-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 rounded-xl flex items-center justify-between cursor-pointer transition active:scale-98">
          <div>
            <div class="font-bold text-xs text-white">${p.name}</div>
            <div class="text-[10px] text-slate-400">${p.club}</div>
          </div>
          <span class="text-[9px] font-bold px-1.5 py-0.5 bg-slate-900 rounded text-emerald-400 border border-slate-700">${p.tier}</span>
        </div>
      `).join('');
    }

    function closePicker() {
      document.getElementById('playerModal').classList.add('hidden');
    }

    function selectPlayer(name, club) {
      const slot = state.currentSlot;
      state.roster[slot] = { name, club };

      const shortName = name.split(' ').pop();
      document.getElementById(`val-${slot}`).innerText = shortName;
      document.getElementById(`club-${slot}`).innerText = club;
      document.getElementById(`slot-${slot}`).classList.add('border-accentGreen', 'bg-emerald-950/60');

      closePicker();
      checkComplete();
    }

    function checkComplete() {
      const filled = Object.values(state.roster).filter(Boolean).length;
      document.getElementById('mainActionBtn').innerText = `🚀 Сохранить состав (${filled}/11)`;
    }

    function toggleRisk(isRisk) {
      state.multiplier = isRisk ? 2 : 1;
      
      const yesBtn = document.getElementById('riskYesBtn');
      const noBtn = document.getElementById('riskNoBtn');
      const badge = document.getElementById('riskBadge');

      if (isRisk) {
        yesBtn.className = 'py-1.5 px-2 bg-amber-500 border border-amber-400 text-slate-950 font-black rounded-lg text-xs transition';
        noBtn.className = 'py-1.5 px-2 bg-slate-800 border border-slate-700 text-slate-400 font-bold rounded-lg text-xs transition';
        badge.innerText = 'x2 🔥';
        badge.className = 'bg-amber-500/20 border border-amber-500 px-2.5 py-0.5 rounded-full text-xs font-black text-amber-400';
      } else {
        noBtn.className = 'py-1.5 px-2 bg-slate-700 border border-slate-600 text-white font-black rounded-lg text-xs transition';
        yesBtn.className = 'py-1.5 px-2 bg-slate-800 border border-slate-700 text-slate-400 font-bold rounded-lg text-xs transition';
        badge.innerText = 'x1';
        badge.className = 'bg-slate-800 border border-slate-700 px-2.5 py-0.5 rounded-full text-xs font-bold text-accentGreen';
      }
    }

    function shareRoster() {
      const filled = Object.values(state.roster).filter(Boolean).length;
      if (filled < 11) {
        alert(`Вы заполнили ${filled} из 11 позиций. Соберите всех игроков!`);
        return;
      }

      const text = `📋 МОЙ ДРАФТ РПЛ (4-3-3):\n` +
        `🧤 ВРТ: ${state.roster.GK.name} (${state.roster.GK.club})\n` +
        `🛡️ ЗАЩ: ${state.roster.LB.name}, ${state.roster.CB1.name}, ${state.roster.CB2.name}, ${state.roster.RB.name}\n` +
        `🎯 ПЗ: ${state.roster.LM.name}, ${state.roster.CM.name}, ${state.roster.RM.name}\n` +
        `⚡ НАП: ${state.roster.LW.name}, ${state.roster.ST.name}, ${state.roster.RW.name}\n\n` +
        `🔥 All-in множитель: x${state.multiplier}`;

      if (tg) {
        tg.openTelegramLink(`https://t.me/share/url?url=&text=${encodeURIComponent(text)}`);
      } else {
        navigator.clipboard.writeText(text);
        alert('Состав из 11 игроков скопирован!');
      }
    }
